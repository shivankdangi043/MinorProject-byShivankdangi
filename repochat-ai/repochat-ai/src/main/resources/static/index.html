<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RepoChat AI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <aside class="sidebar">
    <h1>RepoChat <span>AI</span></h1>
    <p class="hint">Paste a GitHub repo URL, index it, then chat with the code.</p>
    <input id="repoUrl" placeholder="https://github.com/owner/repo" />
    <button id="addBtn">Upload &amp; Analyze</button>
    <div id="status"></div>
    <h3>Indexed repositories</h3>
    <ul id="repoList"></ul>
  </aside>

  <main class="chat">
    <div id="messages">
      <div class="msg bot">Hi! Select a repository on the left, then ask anything about its code.</div>
    </div>
    <div class="inputbar">
      <input id="question" placeholder="e.g. Explain what UserService.java does" />
      <button id="sendBtn">Send</button>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
